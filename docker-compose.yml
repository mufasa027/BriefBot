version: '3.8'

services:
  dashboard:
    build: .
    container_name: cipherbrief-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: always

  ingestion:
    build: .
    container_name: cipherbrief-ingest
    command: python main.py
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: on-failure
